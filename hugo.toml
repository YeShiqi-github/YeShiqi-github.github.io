baseURL = 'https://yeshiqi-github.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = "Stephen Yeh 的博客"
theme = 'hugo-theme-stack'

[pagination]
  pagerSize = 5

[permalinks]
  page = '/:slug/'

[params]
  mainSections = ['research', 'programming', 'english', 'life']
  rssFullContent = true
  favicon = 'img/avatar.png'

  [params.footer]
    since = 2026
    customText = 'Stephen Yeh 的博客'

  [params.sidebar]
    avatar = 'img/avatar.png'

  [params.article]
    toc = true
    readingTime = true

    [params.article.list]
      showTags = true

  [params.widgets]
    homepage = [
      { type = 'search' },
      { type = 'archives', params = { limit = 5 } },
    ]
    page = [{ type = 'toc' }]

  [params.colorScheme]
    toggle = true
    default = 'auto'

  [params.comments]
    enabled = false

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 1

  [menu.main.params]
    icon = 'home'

[[menu.main]]
  name = '科研'
  url = '/research/'
  weight = 2

[[menu.main]]
  name = '编程'
  url = '/programming/'
  weight = 3

[[menu.main]]
  name = '英语'
  url = '/english/'
  weight = 4

[[menu.main]]
  name = '生活'
  url = '/life/'
  weight = 5

[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 6

  [menu.main.params]
    icon = 'archives'

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 7

  [menu.main.params]
    icon = 'search'

[[menu.social]]
  identifier = 'github'
  name = 'GitHub'
  url = 'https://github.com/YeShiqi-github'

  [menu.social.params]
    icon = 'brand-github'

[[menu.social]]
  identifier = 'email'
  name = 'Email'
  url = 'mailto:53200001+YeShiqi-github@users.noreply.github.com'

  [menu.social.params]
    icon = 'messages'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true

        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [['\\[', '\\]'], ['$$', '$$']]
          inline = [['\\(', '\\)']]

    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4

[related]
  includeNewer = true
  threshold = 60
  toLower = false

  [[related.indices]]
    name = 'tags'
    weight = 100

  [[related.indices]]
    name = 'categories'
    weight = 200
